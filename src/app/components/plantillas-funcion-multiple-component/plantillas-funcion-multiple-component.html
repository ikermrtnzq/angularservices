<div style="display: flex; flex-direction: column; gap: 30px;margin-top: 10px;">
    <h1 style="margin-left: 40px;">PLANTILLAS MULTIPLE</h1>
    <form #selectForm="ngForm" (ngSubmit)="obtenerPlantilla()" style="display: flex; flex-direction: column; gap: 5px;">
        <select name="selectfunciones" #selectfunciones multiple size="3"  (mouseenter)="color = 'lightblue'" (mouseleave)="color = 'white'" name="" id="" style="margin-top: 10px; border: 1px solid lightblue; border-radius: 5px;">
            @for (funcion of funciones; track funcion) {
                <option value="{{funcion}}">{{funcion}}</option>
            }
        </select>
        <button style="background-color: lightblue; border: 1px solid lightblue; border-radius: 5px;">Mostrar Plantilla</button>
    </form>
    <table>
        <thead style="background-color:lightblue;border: 3px solid lightblue;">
            <tr> 
                <th style="padding-left: 5px;">Apellido</th>
                <th style="padding-left: 5px;">Funcion</th>
                <th style="padding-left: 5px;">Turno</th>
                <th style="padding-left: 5px;">Salario</th>
            </tr>
        </thead>
        <tbody>
            @for (usuario of plantilla; track usuario) {
                <tr style="border: 1px solid lightblue;">
                    <td style="border: 3px solid lightblue;padding-left: 5px;">{{usuario.apellido}}</td>
                    <td style="border: 3px solid lightblue; padding-left: 5px;">{{usuario.funcion}}</td>
                    <td style="border: 3px solid lightblue;padding-left: 5px;">{{usuario.turno}}</td>
                    <td style="border: 3px solid lightblue;padding-left: 5px;">{{usuario.salario}}</td>
                </tr>
            }
        </tbody>
    </table>
</div>
